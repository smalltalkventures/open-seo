name: OpenSEO Cloudflare Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenSEO Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create self-host configuration
        env:
          DATAFORSEO_API_KEY: ${{ secrets.DATAFORSEO_API_KEY }}
          ACCESS_ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}
          OPENSEO_CUSTOM_DOMAIN: ${{ secrets.OPENSEO_CUSTOM_DOMAIN }}
        run: |
          test -n "$DATAFORSEO_API_KEY"
          test -n "$ACCESS_ALLOWED_EMAILS"
          test -n "$OPENSEO_CUSTOM_DOMAIN"

          {
            printf 'DATAFORSEO_API_KEY=%s\n' "$DATAFORSEO_API_KEY"
            printf 'ACCESS_ALLOWED_EMAILS=%s\n' "$ACCESS_ALLOWED_EMAILS"
            printf 'OPENSEO_CUSTOM_DOMAIN=%s\n' "$OPENSEO_CUSTOM_DOMAIN"
          } > .env.selfhost

          chmod 600 .env.selfhost

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          curl --fail-with-body --silent --show-error \
            --request GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /dev/null

          echo "Cloudflare account authentication successful"

      - name: Build OpenSEO
        run: pnpm exec vite build --mode selfhost

      - name: Validation complete
        run: |
          echo "OpenSEO build completed successfully."
          echo "Production deployment has NOT been executed."
